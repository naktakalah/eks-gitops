# copy to .github/workflows/ to enable
name: Charts CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: azure/setup-helm@v4
        with:
          version: v3.19.0

      - name: Lint, template and version check of the changed charts
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: scripts/check-charts.sh "$BASE_SHA"
