{{/* same selector on both, Argo Rollouts adds rollouts-pod-template-hash to split stable and canary */}}
{{- range $svc := list (include "web-app.stableService" $) (include "web-app.canaryService" $) }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $svc }}
  labels:
    {{- include "web-app.labels" $ | nindent 4 }}
  {{- with $.Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: ClusterIP
  ports:
    - name: http
      port: {{ $.Values.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "web-app.selectorLabels" $ | nindent 4 }}
{{- end }}
